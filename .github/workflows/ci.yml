name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests (tiny random model, synthetic faces — no weights or datasets needed)
        run: pytest -q

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Bundle + DMG
        run: ../scripts/package_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hushkey.dmg
          path: build/Hushkey.dmg

  installer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install model server into a temp home (no weights download)
        run: HUSHKEY_HOME="$RUNNER_TEMP/hk home" HUSHKEY_SKIP_DOWNLOAD=1 scripts/install_backend.sh
      - name: Server starts
        run: |
          "$RUNNER_TEMP/hk home/venv/bin/python" -m hushkey.cli serve --tiny --port 8799 &
          for i in $(seq 1 60); do curl -sf localhost:8799/v1/health && exit 0; sleep 2; done; exit 1
