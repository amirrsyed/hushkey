name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests (tiny random model, synthetic faces — no weights or datasets needed)
        run: pytest -q

  app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Bundle
        run: ../scripts/build_app.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Hushkey.app
          path: build/Hushkey.app
