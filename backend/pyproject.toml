[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hushkey"
version = "0.1.0"
description = "Silent-speech (no audio) webcam dictation: Auto-AVSR + LoRA + kinematic fusion, served locally for the Hushkey Mac app"
readme = "README.md"
license = "MIT AND Apache-2.0"  # MIT: Hushkey code; Apache-2.0: vendored ESPnet / Auto-AVSR code
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "sentencepiece>=0.1.99",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
prepare = ["mediapipe>=0.10.14"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hushkey = "hushkey.cli:main"

[tool.setuptools.packages.find]
include = ["hushkey*"]

[tool.setuptools.package-data]
hushkey = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
